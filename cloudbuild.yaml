steps:
  # Docker image build කරන්න
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/auton-dh/cloud-run-source-deploy/d-pay-web-app/d-pay-web-app'
      - '.'

  # Docker image push කරන්න
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/auton-dh/cloud-run-source-deploy/d-pay-web-app/d-pay-web-app'

  # Cloud Run deploy කරන්න
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'd-pay-web-app'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/auton-dh/cloud-run-source-deploy/d-pay-web-app/d-pay-web-app'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'asia-southeast1-docker.pkg.dev/auton-dh/cloud-run-source-deploy/d-pay-web-app/d-pay-web-app'